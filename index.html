<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeloGuesser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <header>
      <div class="logo">Belo<span>Guesser</span></div>
      <div class="header-right">
        <button class="theme-btn" id="theme-btn" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="2" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="22" />
            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
            <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
            <line x1="2" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="22" y2="12" />
            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>

        <a
          class="github-link"
          href="https://github.com/"
          target="_blank"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
            />
          </svg>
          GitHub
        </a>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="profile-section">
          <div class="section-label">Player</div>
          <div class="nick-wrapper">
            <input
              id="nick-input"
              type="text"
              maxlength="24"
              placeholder="NICKNAME"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="nick-save-btn" id="nick-save">Save</button>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="stat-games">0</div>
            <div class="stat-label">Games played</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-wins">0</div>
            <div class="stat-label">Wins</div>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-label">Settings</div>
          <div class="settings-grid">
            <div class="setting-box">
              <div class="setting-name">Round time</div>
              <div class="stepper" id="stepper-time">
                <button class="stepper-btn" data-dir="-1">−</button>
                <div class="stepper-val" id="val-time">60s</div>
                <button class="stepper-btn" data-dir="1">+</button>
              </div>
            </div>
            <div class="setting-box">
              <div class="setting-name">Rounds</div>
              <div class="stepper" id="stepper-rounds">
                <button class="stepper-btn" data-dir="-1">−</button>
                <div class="stepper-val" id="val-rounds">5</div>
                <button class="stepper-btn" data-dir="1">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="play-section">
          <div class="section-label">Play</div>
          <div class="play-controls">
            <button class="btn-solo" id="btn-solo">
              Play Solo
              <span class="arrow">→</span>
            </button>
            <button class="btn-create" id="btn-create">
              Create room
              <span class="arrow">→</span>
            </button>
            <div class="join-row">
              <input
                id="room-code"
                type="text"
                maxlength="8"
                placeholder="Enter room code"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="btn-join" id="btn-join">Join</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-text">BeloGuesser · v1.0</div>
      <div class="win-rate" id="win-rate"></div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="menu.js"></script>
  </body>
</html>
